name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pip install -e ".[server,mcp,arrow]"
      - run: ruff check .
      - name: Tests with 100% coverage gate
        run: pytest --cov --cov-report=term-missing

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.85.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rust unit tests
        run: cargo test --locked
      - name: Build and verify PyO3 native extension
        run: |
          pip install maturin -r requirements-dev.txt
          pip install -e ".[server,mcp,arrow]"
          maturin build --release --locked --out dist
          python -m zipfile -e dist/*.whl native_x
          cp -r native_x/_phone_standardizer_rs "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/"
          python -c "import phone_standardizer as ps; assert ps.is_native_available(), 'Native extension not loaded'"
          pytest

  sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test
      - name: Go SDK
        working-directory: sdks/go
        run: |
          go vet ./...
          go test -v ./...
      - name: .NET SDK
        run: dotnet build sdks/dotnet/PhoneStandardizer.Client.csproj -c Release
