version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      python-dev:
        dependency-type: development
        update-types: [minor, patch]
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      cargo-dev:
        dependency-type: development
        update-types: [minor, patch]
      cargo-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
