[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-standardizer"
version = "2.1.0"
description = "Unified multi-national Entity, Address (USPS Pub 28 / UPU S42), and Phone (ITU-T E.164 / E.123 / RFC 3966) standardization, bidirectional cross-healing, and entity resolution engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "HobbyHabbit LLC", email = "support@hobbyhabbit.com" }
]
maintainers = [
    { name = "Jacob White", email = "jake@hobbyhabbit.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "h3>=4.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]
redis = [
    "redis>=5.0",
]
mcp = [
    "mcp>=1.0.0",
]
arrow = [
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "numpy>=1.24",
]
ml = [
    "usaddress>=0.5.16",
]
translit = [
    "anyascii>=0.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.100.0",
    "tzdata>=2024.1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
entity-standardizer = "entity_standardizer.cli:main"
entity-standardizer-mcp = "entity_standardizer.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["entity_standardizer*"]

[tool.setuptools.package-data]
"entity_standardizer.address" = [
    "reference/data/*.tsv.gz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".claude", ".hypothesis", "node_modules", ".git", "build", "dist", "target"]
python_files = ["test_*.py"]
markers = [
    "perf: absolute-throughput/memory SLA tests; run without coverage tracing (pytest -m perf)",
]

[tool.coverage.run]
source = ["entity_standardizer"]
omit = ["entity_standardizer/address/*"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_empty = true

[tool.ruff]
line-length = 120
extend-exclude = [".claude", "target", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402"]

[tool.maturin]
features = ["extension-module"]
python-packages = ["entity_standardizer"]
