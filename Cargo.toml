[package]
name = "_entity_standardizer_rs"
version = "2.1.0"
edition = "2021"
rust-version = "1.83"
description = "Optional native Rust acceleration module for Entity Standardizer (Phone + Address + Company normalization, Soundex, Damerau-Levenshtein, and batch E.164 dispatch)."
authors = ["HobbyHabbit LLC <support@hobbyhabbit.com>"]
license = "MIT"
repository = "https://github.com/Jacob-white/Entity-Standardizer"
readme = "README.md"
publish = false

[lib]
name = "_entity_standardizer_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"

[features]
default = []
# maturin enables this for wheel builds; `cargo test` runs without it so the test binary can link libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
